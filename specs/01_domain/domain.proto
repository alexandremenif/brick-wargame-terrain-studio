syntax = "proto3";

package lego.wargame.terrain.studio;

// ============================================================================
// Primitive Types & Domain Entities
// ============================================================================

enum RotationDegree {
  ROTATION_0 = 0;
  ROTATION_90 = 90;
  ROTATION_180 = 180;
  ROTATION_270 = 270;
}

message BoundingBox {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
}

message LegoColor {
  int32 id = 1;
  string name = 2;
  string hex = 3;
  string category = 4; // "solid", "transparent", "metallic"
}

message TextureDefinition {
  string id = 1;
  string name = 2;
  string svg_path = 3;
  optional string default_color = 4;
}

message CellData {
  int32 x = 1;
  int32 y = 2;
  optional int32 color_id = 3; // null / unset = transparent (alpha channel)
  optional string texture_id = 4;
  RotationDegree texture_rotation = 5;
}

message PresetInstance {
  string instance_id = 1;
  string preset_id = 2;
  int32 x = 3;
  int32 y = 4;
  RotationDegree rotation = 5;
  int32 z_index = 6;
  bool locked = 7;
}

message TilemapSummary {
  string id = 1;
  string name = 2;
  bool is_root_map = 3;
  int32 width = 4;
  int32 height = 5;
  optional int32 base_color_id = 6;
  int32 total_instances = 7;
}

message ActionLogEntry {
  int64 sequence_id = 1;
  string tilemap_id = 2;
  string timestamp = 3;
  string action_type = 4;
  string payload_json = 5;
  string rollback_json = 6;
  bool is_undone = 7;
}
