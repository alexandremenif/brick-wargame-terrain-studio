syntax = "proto3";

package lego.wargame.terrain.studio;

import "domain.proto";

// ============================================================================
// Public Inbound API: TerrainEngineService & Wire Commands
// ============================================================================

message PaintAreaCommand {
  string tilemap_id = 1;
  BoundingBox bbox = 2;
  optional int32 color_id = 3;
  optional string texture_id = 4;
}

message PaintAreaResponse {
  int32 affected_cells_count = 1;
  int64 sequence_id = 2;
}

message PlacePresetCommand {
  string parent_tilemap_id = 1;
  string preset_id = 2;
  int32 x = 3;
  int32 y = 4;
  RotationDegree rotation = 5;
}

message PlacePresetResponse {
  string instance_id = 1;
  int64 sequence_id = 2;
}

message MovePresetCommand {
  string instance_id = 1;
  int32 new_x = 2;
  int32 new_y = 3;
}

message MovePresetResponse {
  bool success = 1;
  int64 sequence_id = 2;
}

message DeletePresetCommand {
  string instance_id = 1;
}

message DeletePresetResponse {
  bool success = 1;
  int64 sequence_id = 2;
}

message UndoCommand {
  string tilemap_id = 1;
}

message UndoResponse {
  string undone_action_type = 1;
  bool remaining_undo = 2;
}

message RedoCommand {
  string tilemap_id = 1;
}

message RedoResponse {
  string redone_action_type = 1;
  bool remaining_redo = 2;
}

message RenderBBoxImageRequest {
  string tilemap_id = 1;
  BoundingBox bbox = 2;
  string format = 3; // "png" or "jpeg"
  int32 pixel_scale = 4;
  bool show_grid = 5;
}

message RenderBBoxImageResponse {
  string mime_type = 1;
  int32 width = 2;
  int32 height = 3;
  string base64_data = 4;
}

service TerrainEngineService {
  rpc PaintArea (PaintAreaCommand) returns (PaintAreaResponse);
  rpc PlacePreset (PlacePresetCommand) returns (PlacePresetResponse);
  rpc MovePreset (MovePresetCommand) returns (MovePresetResponse);
  rpc DeletePreset (DeletePresetCommand) returns (DeletePresetResponse);
  rpc Undo (UndoCommand) returns (UndoResponse);
  rpc Redo (RedoCommand) returns (RedoResponse);
  rpc RenderBBoxImage (RenderBBoxImageRequest) returns (RenderBBoxImageResponse);
}
