openrpc: "1.2.6"
info:
  title: "LEGO Wargame Terrain Studio Wire API"
  version: "1.0.0"
  description: "JSON-RPC 2.0 wire protocol specification for LEGO Wargame Terrain Studio"
servers:
  - name: "Local WebSocket Server"
    url: "ws://localhost:4000"
methods:
  - name: "createAsset"
    description: "Create a new terrain asset with specified name and dimensions"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/CreateAssetCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/CreateAssetResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "updateAssetDimensions"
    description: "Update the dimensions of an existing asset"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/UpdateAssetDimensionsCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/UpdateAssetDimensionsResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "setBoundingBox"
    description: "Set the active bounding box region of an asset"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/SetBoundingBoxCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/SetBoundingBoxResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "paintArea"
    description: "Paint a rectangular bounding box or 1x1 stud cell with an official LEGO color"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/PaintAreaCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/PaintAreaResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "listAssets"
    description: "List all existing terrain assets"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/ListAssetsCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/ListAssetsResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "listColors"
    description: "List all official LEGO colors"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/ListColorsCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/ListColorsResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "getAssetImage"
    description: "Get a rendered SVG image of the asset or bounding box"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/GetAssetImageCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/GetAssetImageResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"
