openrpc: "1.2.6"
info:
  title: "LEGO Wargame Terrain Studio Wire API"
  version: "1.0.0"
  description: "JSON-RPC 2.0 wire protocol specification for LEGO Wargame Terrain Studio"
servers:
  - name: "Local HTTP Server"
    url: "http://localhost:4000"
methods:
  - name: "createAsset"
    description: "Create a new terrain asset with specified name and dimensions"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/CreateAssetCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/CreateAssetResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "updateAsset"
    description: "Update the name or dimensions of an existing asset"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/UpdateAssetCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/UpdateAssetResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "getAsset"
    description: "Retrieve an asset full state including painted cells"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/GetAssetCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/GetAssetResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "deleteAsset"
    description: "Delete an asset and its cells"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/DeleteAssetCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/DeleteAssetResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "paintArea"
    description: "Paint or erase a rectangular bounding box or 1x1 stud cell with an official LEGO color (or null to clear)"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/PaintAreaCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/PaintAreaResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "listAssets"
    description: "List all existing terrain assets"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/ListAssetsCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/ListAssetsResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "listColors"
    description: "List all official LEGO colors"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/ListColorsCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/ListColorsResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"

  - name: "getAssetImage"
    description: "Get a rendered SVG image of the asset or optional bounding box"
    params:
      - name: "command"
        required: true
        schema:
          $ref: "../domain/schemas/commands.yaml#/definitions/GetAssetImageCommand"
    result:
      name: "result"
      schema:
        $ref: "../domain/schemas/commands.yaml#/definitions/GetAssetImageResponse"
    errors:
      - code: -32602
        message: "Invalid params"
      - code: -32000
        message: "Internal engine error"
