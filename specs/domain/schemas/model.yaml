$schema: "http://json-schema.org/draft-07/schema#"
title: DomainModel
description: Pure protocol-agnostic domain entities for Brick Wargame Terrain Studio
definitions:
  BoundingBox:
    title: BoundingBox
    type: object
    description: 2D rectangular region measured in studs
    properties:
      x:
        type: integer
        description: Top-left X coordinate in studs
      y:
        type: integer
        description: Top-left Y coordinate in studs
      width:
        type: integer
        minimum: 1
        description: Width in studs
      height:
        type: integer
        minimum: 1
        description: Height in studs
    required:
      - x
      - y
      - width
      - height
    additionalProperties: false

  BrickColor:
    title: BrickColor
    type: object
    description: Official brick color definition
    properties:
      id:
        type: integer
        description: Color numeric ID
      name:
        type: string
        description: Official brick color name (e.g. Bright Green)
      hex:
        type: string
        pattern: "^#[0-9A-Fa-f]{6}$"
        description: Hexadecimal color string #RRGGBB
    required:
      - id
      - name
      - hex
    additionalProperties: false

  CellData:
    title: CellData
    type: object
    description: Individual stud coordinate with applied brick color ID
    properties:
      x:
        type: integer
        description: Stud X coordinate
      y:
        type: integer
        description: Stud Y coordinate
      colorId:
        type: integer
        description: Applied brick color ID
    required:
      - x
      - y
      - colorId
    additionalProperties: false

  AssetSummary:
    title: AssetSummary
    type: object
    description: Summary metadata of an asset
    properties:
      id:
        type: string
        description: Unique asset identifier
      name:
        type: string
        description: Asset name
      width:
        type: integer
        minimum: 1
        description: Grid width in studs
      height:
        type: integer
        minimum: 1
        description: Grid height in studs
      paintedCellsCount:
        type: integer
        minimum: 0
        description: Total count of painted cells
    required:
      - id
      - name
      - width
      - height
      - paintedCellsCount
    additionalProperties: false

  Asset:
    title: Asset
    type: object
    description: Complete asset domain entity with painted cells
    properties:
      id:
        type: string
        description: Unique asset identifier
      name:
        type: string
        description: Asset name
      width:
        type: integer
        minimum: 1
        description: Grid width in studs
      height:
        type: integer
        minimum: 1
        description: Grid height in studs
      boundingBox:
        $ref: "#/definitions/BoundingBox"
      paintedCellsCount:
        type: integer
        minimum: 0
        description: Total count of painted cells
      cells:
        type: array
        items:
          $ref: "#/definitions/CellData"
        description: List of currently painted cells
    required:
      - id
      - name
      - width
      - height
      - paintedCellsCount
      - cells
    additionalProperties: false
