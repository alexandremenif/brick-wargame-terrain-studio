$schema: "http://json-schema.org/draft-07/schema#"
title: DomainCommands
description: Pure protocol-agnostic domain command and response schemas for Single Asset Studio & Parity MVP
definitions:
  CreateAssetCommand:
    title: CreateAssetCommand
    type: object
    description: Command to initialize a new terrain asset
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 100
        description: Name of the asset
      width:
        type: integer
        minimum: 1
        maximum: 1000
        description: Width in studs
      height:
        type: integer
        minimum: 1
        maximum: 1000
        description: Height in studs
    required:
      - name
      - width
      - height
    additionalProperties: false

  CreateAssetResponse:
    title: CreateAssetResponse
    type: object
    description: Result of creating an asset
    properties:
      asset:
        $ref: "model.yaml#/definitions/Asset"
    required:
      - asset
    additionalProperties: false

  UpdateAssetCommand:
    title: UpdateAssetCommand
    type: object
    description: Generic command to update asset properties (name, dimensions)
    properties:
      assetId:
        type: string
        description: Target asset identifier
      name:
        type: string
        minLength: 1
        maxLength: 100
        description: New asset name
      width:
        type: integer
        minimum: 1
        maximum: 1000
        description: New width in studs
      height:
        type: integer
        minimum: 1
        maximum: 1000
        description: New height in studs
    required:
      - assetId
    additionalProperties: false

  UpdateAssetResponse:
    title: UpdateAssetResponse
    type: object
    description: Result of updating an asset
    properties:
      asset:
        $ref: "model.yaml#/definitions/Asset"
    required:
      - asset
    additionalProperties: false

  GetAssetCommand:
    title: GetAssetCommand
    type: object
    description: Command to retrieve an asset's full state
    properties:
      assetId:
        type: string
        description: Target asset identifier
    required:
      - assetId
    additionalProperties: false

  GetAssetResponse:
    title: GetAssetResponse
    type: object
    description: Detailed asset state
    properties:
      asset:
        $ref: "model.yaml#/definitions/Asset"
    required:
      - asset
    additionalProperties: false

  DeleteAssetCommand:
    title: DeleteAssetCommand
    type: object
    description: Command to delete an asset
    properties:
      assetId:
        type: string
        description: Target asset identifier
    required:
      - assetId
    additionalProperties: false

  DeleteAssetResponse:
    title: DeleteAssetResponse
    type: object
    description: Result of deleting an asset
    properties:
      success:
        type: boolean
    required:
      - success
    additionalProperties: false

  PaintAreaCommand:
    title: PaintAreaCommand
    type: object
    description: Command to paint or erase a rectangular area or 1x1 stud cell
    properties:
      assetId:
        type: string
        description: Target asset identifier
      bbox:
        $ref: "model.yaml#/definitions/BoundingBox"
      colorId:
        type: ["integer", "null"]
        description: Official brick color ID to apply, or null to erase/clear cells
    required:
      - assetId
      - bbox
      - colorId
    additionalProperties: false

  PaintAreaResponse:
    title: PaintAreaResponse
    type: object
    description: Result of painting or erasing an area
    properties:
      affectedCellsCount:
        type: integer
        minimum: 0
    required:
      - affectedCellsCount
    additionalProperties: false

  ListAssetsCommand:
    title: ListAssetsCommand
    type: object
    description: Command to list all available assets
    properties: {}
    additionalProperties: false

  ListAssetsResponse:
    title: ListAssetsResponse
    type: object
    description: List of available assets
    properties:
      assets:
        type: array
        items:
          $ref: "model.yaml#/definitions/AssetSummary"
    required:
      - assets
    additionalProperties: false

  ListColorsCommand:
    title: ListColorsCommand
    type: object
    description: Command to list all available official brick colors
    properties: {}
    additionalProperties: false

  ListColorsResponse:
    title: ListColorsResponse
    type: object
    description: Catalog of official brick colors
    properties:
      colors:
        type: array
        items:
          $ref: "model.yaml#/definitions/BrickColor"
    required:
      - colors
    additionalProperties: false

  ExportImageCommand:
    title: ExportImageCommand
    type: object
    description: Command to export a terrain asset as a rendered PNG image
    properties:
      assetId:
        type: string
        description: Target asset identifier
      bbox:
        $ref: "model.yaml#/definitions/BoundingBox"
        description: Optional framed bounding box to export; defaults to full asset
      profile:
        type: string
        enum:
          - llm
          - print
        default: llm
        description: Rendering quality profile ('llm' with adaptive scale and checkerboard, or 'print' at 64px/stud with white background)
    required:
      - assetId
    additionalProperties: false

  ExportImageResponse:
    title: ExportImageResponse
    type: object
    description: Rendered PNG image data
    properties:
      data:
        type: string
        description: Base64-encoded PNG image binary data
    required:
      - data
    additionalProperties: false

