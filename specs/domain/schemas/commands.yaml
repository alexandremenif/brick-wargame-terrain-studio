$schema: "http://json-schema.org/draft-07/schema#"
title: DomainCommands
description: Pure protocol-agnostic domain command and response schemas for Single Asset Studio & Parity MVP
definitions:
  CreateAssetCommand:
    title: CreateAssetCommand
    type: object
    description: Command to initialize a new terrain asset
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 100
        description: Name of the asset
      width:
        type: integer
        minimum: 1
        maximum: 1000
        description: Width in studs
      height:
        type: integer
        minimum: 1
        maximum: 1000
        description: Height in studs
    required:
      - name
      - width
      - height
    additionalProperties: false

  CreateAssetResponse:
    title: CreateAssetResponse
    type: object
    description: Result of creating an asset
    properties:
      asset:
        $ref: "model.yaml#/definitions/Asset"
    required:
      - asset
    additionalProperties: false

  UpdateAssetCommand:
    title: UpdateAssetCommand
    type: object
    description: Generic command to update asset properties (name, dimensions)
    properties:
      assetId:
        type: string
        description: Target asset identifier
      name:
        type: string
        minLength: 1
        maxLength: 100
        description: New asset name
      width:
        type: integer
        minimum: 1
        maximum: 1000
        description: New width in studs
      height:
        type: integer
        minimum: 1
        maximum: 1000
        description: New height in studs
    required:
      - assetId
    additionalProperties: false

  UpdateAssetResponse:
    title: UpdateAssetResponse
    type: object
    description: Result of updating an asset
    properties:
      asset:
        $ref: "model.yaml#/definitions/Asset"
    required:
      - asset
    additionalProperties: false

  GetAssetCommand:
    title: GetAssetCommand
    type: object
    description: Command to retrieve an asset's full state
    properties:
      assetId:
        type: string
        description: Target asset identifier
    required:
      - assetId
    additionalProperties: false

  GetAssetResponse:
    title: GetAssetResponse
    type: object
    description: Detailed asset state
    properties:
      asset:
        $ref: "model.yaml#/definitions/Asset"
    required:
      - asset
    additionalProperties: false

  DeleteAssetCommand:
    title: DeleteAssetCommand
    type: object
    description: Command to delete an asset
    properties:
      assetId:
        type: string
        description: Target asset identifier
    required:
      - assetId
    additionalProperties: false

  DeleteAssetResponse:
    title: DeleteAssetResponse
    type: object
    description: Result of deleting an asset
    properties:
      success:
        type: boolean
    required:
      - success
    additionalProperties: false

  PaintAreaCommand:
    title: PaintAreaCommand
    type: object
    description: Command to paint or erase a rectangular area or 1x1 stud cell
    properties:
      assetId:
        type: string
        description: Target asset identifier
      bbox:
        $ref: "model.yaml#/definitions/BoundingBox"
      colorId:
        type: ["integer", "null"]
        description: Official LEGO color ID to apply, or null to erase/clear cells
    required:
      - assetId
      - bbox
      - colorId
    additionalProperties: false

  PaintAreaResponse:
    title: PaintAreaResponse
    type: object
    description: Result of painting or erasing an area
    properties:
      affectedCellsCount:
        type: integer
        minimum: 0
    required:
      - affectedCellsCount
    additionalProperties: false

  ListAssetsCommand:
    title: ListAssetsCommand
    type: object
    description: Command to list all available assets
    properties: {}
    additionalProperties: false

  ListAssetsResponse:
    title: ListAssetsResponse
    type: object
    description: List of available assets
    properties:
      assets:
        type: array
        items:
          $ref: "model.yaml#/definitions/AssetSummary"
    required:
      - assets
    additionalProperties: false

  ListColorsCommand:
    title: ListColorsCommand
    type: object
    description: Command to list all available official LEGO colors
    properties: {}
    additionalProperties: false

  ListColorsResponse:
    title: ListColorsResponse
    type: object
    description: Catalog of official LEGO colors
    properties:
      colors:
        type: array
        items:
          $ref: "model.yaml#/definitions/LegoColor"
    required:
      - colors
    additionalProperties: false

  GetAssetImageCommand:
    title: GetAssetImageCommand
    type: object
    description: Command to query a rendered SVG image representation of the asset or bounding box
    properties:
      assetId:
        type: string
        description: Target asset identifier
      bbox:
        $ref: "model.yaml#/definitions/BoundingBox"
    required:
      - assetId
    additionalProperties: false

  GetAssetImageResponse:
    title: GetAssetImageResponse
    type: object
    description: Rendered SVG image representation
    properties:
      image:
        type: string
        description: SVG string representation of the asset rendering
      format:
        type: string
        enum: ["svg"]
      width:
        type: integer
      height:
        type: integer
    required:
      - image
      - format
      - width
      - height
    additionalProperties: false
