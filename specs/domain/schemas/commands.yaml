$schema: "http://json-schema.org/draft-07/schema#"
title: DomainCommands
description: Pure protocol-agnostic domain command and response schemas for Single Asset Studio & Parity MVP
definitions:
  CreateAssetCommand:
    title: CreateAssetCommand
    type: object
    description: Command to initialize a new terrain asset
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 100
        description: Name of the asset
      width:
        type: integer
        minimum: 1
        maximum: 1000
        description: Width in studs
      height:
        type: integer
        minimum: 1
        maximum: 1000
        description: Height in studs
    required:
      - name
      - width
      - height
    additionalProperties: false

  CreateAssetResponse:
    title: CreateAssetResponse
    type: object
    description: Result of creating an asset
    properties:
      asset:
        $ref: "model.yaml#/definitions/Asset"
    required:
      - asset
    additionalProperties: false

  UpdateAssetDimensionsCommand:
    title: UpdateAssetDimensionsCommand
    type: object
    description: Command to update/resize asset dimensions
    properties:
      assetId:
        type: string
        description: Target asset identifier
      width:
        type: integer
        minimum: 1
        maximum: 1000
        description: New width in studs
      height:
        type: integer
        minimum: 1
        maximum: 1000
        description: New height in studs
    required:
      - assetId
      - width
      - height
    additionalProperties: false

  UpdateAssetDimensionsResponse:
    title: UpdateAssetDimensionsResponse
    type: object
    description: Result of updating asset dimensions
    properties:
      asset:
        $ref: "model.yaml#/definitions/Asset"
    required:
      - asset
    additionalProperties: false

  SetBoundingBoxCommand:
    title: SetBoundingBoxCommand
    type: object
    description: Command to set the active bounding box of an asset
    properties:
      assetId:
        type: string
        description: Target asset identifier
      bbox:
        $ref: "model.yaml#/definitions/BoundingBox"
    required:
      - assetId
      - bbox
    additionalProperties: false

  SetBoundingBoxResponse:
    title: SetBoundingBoxResponse
    type: object
    description: Result of setting bounding box
    properties:
      asset:
        $ref: "model.yaml#/definitions/Asset"
    required:
      - asset
    additionalProperties: false

  PaintAreaCommand:
    title: PaintAreaCommand
    type: object
    description: Command to paint a rectangular area or a single 1x1 cell
    properties:
      assetId:
        type: string
        description: Target asset identifier
      bbox:
        $ref: "model.yaml#/definitions/BoundingBox"
      colorId:
        type: integer
        description: Official LEGO color ID to apply
    required:
      - assetId
      - bbox
      - colorId
    additionalProperties: false

  PaintAreaResponse:
    title: PaintAreaResponse
    type: object
    description: Result of painting an area
    properties:
      affectedCellsCount:
        type: integer
        minimum: 0
    required:
      - affectedCellsCount
    additionalProperties: false

  ListAssetsCommand:
    title: ListAssetsCommand
    type: object
    description: Command to list all available assets
    properties: {}
    additionalProperties: false

  ListAssetsResponse:
    title: ListAssetsResponse
    type: object
    description: List of available assets
    properties:
      assets:
        type: array
        items:
          $ref: "model.yaml#/definitions/Asset"
    required:
      - assets
    additionalProperties: false

  ListColorsCommand:
    title: ListColorsCommand
    type: object
    description: Command to list all available official LEGO colors
    properties: {}
    additionalProperties: false

  ListColorsResponse:
    title: ListColorsResponse
    type: object
    description: Catalog of official LEGO colors
    properties:
      colors:
        type: array
        items:
          $ref: "model.yaml#/definitions/LegoColor"
    required:
      - colors
    additionalProperties: false

  GetAssetImageCommand:
    title: GetAssetImageCommand
    type: object
    description: Command to query a rendered SVG image representation of the asset or bounding box
    properties:
      assetId:
        type: string
        description: Target asset identifier
      bbox:
        $ref: "model.yaml#/definitions/BoundingBox"
    required:
      - assetId
    additionalProperties: false

  GetAssetImageResponse:
    title: GetAssetImageResponse
    type: object
    description: Rendered SVG image representation
    properties:
      image:
        type: string
        description: SVG string representation of the asset rendering
      format:
        type: string
        enum: ["svg"]
      width:
        type: integer
      height:
        type: integer
    required:
      - image
      - format
      - width
      - height
    additionalProperties: false
